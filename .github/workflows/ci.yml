name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # any file I/O that relies on the platform's default encoding fails the build (it breaks on Windows)
      - run: uv run python -X warn_default_encoding -W error::EncodingWarning -m pytest -q

  frameworks:
    # each integration against the real framework, driven by a scripted model (no API keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: >-
          uv run --with openai-agents --with langgraph --with langchain-core --with google-adk
          --with claude-agent-sdk --with opentelemetry-sdk --with anthropic --with openai --with google-genai
          pytest -q -rs

  crewai:
    # separate job: CrewAI pins its own versions of shared dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run --with crewai pytest -q tests/test_crewai.py

  install-from-scratch:
    # what a new user does: pip install into a clean environment, then run the quickstart from another folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv /tmp/env && /tmp/env/bin/pip install .
      - run: |
          cd /tmp
          /tmp/env/bin/agent-regress run "$GITHUB_WORKSPACE/examples/quickstart/suite.py" --save-baseline
          AGENT_VERSION=2 /tmp/env/bin/agent-regress run "$GITHUB_WORKSPACE/examples/quickstart/suite.py" && exit 1 || test $? -eq 1
