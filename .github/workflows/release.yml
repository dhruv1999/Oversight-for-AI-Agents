name: release
# Push a tag like v0.2.0 to build and publish to PyPI.
# One time setup on pypi.org: add this repository as a trusted publisher for the project
# "oversight-for-ai-agents" (workflow: release.yml, environment: pypi). No API token is stored here.
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
