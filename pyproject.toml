[project]
name = "oversight-for-ai-agents"
version = "0.2.0"
description = "Adaptive oversight routing for AI agents: self, safety model, or human, based on action risk and human attention."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
oversight = "oversight.cli:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40",
]
mcp = [
    "mcp>=2.2",
]
openai = [
    "openai>=3.28",
]
gemini = [
    "google-genai>=2.29",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "pytest>=8",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oversight"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "UP042"]  # str-mixin enums serialize cleanly to JSON

[tool.ruff.lint.per-file-ignores]
"oversight/sim/scenarios.py" = ["E501"]  # template tables read best one per line
"scripts/make_report.py" = ["E501"]  # markdown table rows

[tool.mypy]
# no python_version: each CI job checks against its own Python (3.11 to 3.13), which keeps 3.11 covered
# and lets mypy read dependency stubs written for newer versions (numpy, via the OpenAI SDK)
packages = ["oversight"]
warn_unused_ignores = true
