[project]
name = "adaptive-oversight"
version = "0.1.0"
description = "Adaptive oversight routing for AI agents: self, safety model, or human, based on action risk and human attention."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oversight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
