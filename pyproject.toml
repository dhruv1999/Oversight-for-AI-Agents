[project]
name = "agent-regress"
version = "0.1.0"
description = "Regression tests for AI agents: catch behaviour changes before they ship, in CI, with any framework."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dhruv Parmar" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai agents", "evaluation", "evals", "regression testing", "llm", "langgraph", "crewai", "openai agents", "google adk", "claude agent sdk", "langfuse", "opentelemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/dhruv1999/Oversight-for-AI-Agents"
Issues = "https://github.com/dhruv1999/Oversight-for-AI-Agents/issues"

[project.scripts]
agent-regress = "agent_regress.cli:main"

[project.optional-dependencies]
# only needed for model graded checks (expect.judge); everything else has no dependencies
anthropic = ["anthropic>=0.75"]
openai = ["openai>=1.60"]
gemini = ["google-genai>=1.20"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_regress"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.md"]  # code in the docs is laid out for reading
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
packages = ["agent_regress"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# optional: the framework and provider SDKs are imported only when you use their integration
module = ["anthropic", "openai", "google", "google.*", "agents", "crewai", "crewai.*", "claude_agent_sdk"]
ignore_missing_imports = true
